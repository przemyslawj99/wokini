plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.kursnahoryzont.game'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.kursnahoryzont.game'
        minSdk 23
        targetSdk 35
        versionCode 26
        versionName '0.6.3'
    }

    signingConfigs {
        release {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
