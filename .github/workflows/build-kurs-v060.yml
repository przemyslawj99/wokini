name: Build Kurs na Horyzont v0.6.6

on:
  push:
    branches:
      - chatgpt-kurs-v060-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run id
        run: |
          mkdir -p kurs-v066
          printf '%s\n' "${{ github.run_id }}" > kurs-v066/latest_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurs-v066/latest_run.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record v0.6.6 build run [skip ci]"
            git push origin HEAD:chatgpt-kurs-v060-build
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct v0.6.3 source
        run: |
          cat kurs-v060/chunks/chunk_* > project.b64
          base64 -d project.b64 > project.zip
          rm -rf build-project
          mkdir build-project
          unzip -q project.zip -d build-project
          cat kurs-v060/v063-patch/chunk_* > v063.patch.gz.b64
          base64 -d v063.patch.gz.b64 > v063.patch.gz
          gzip -dc v063.patch.gz > v063.patch
          cd build-project
          patch -p1 < ../v063.patch

      - name: Apply v0.6.4 collision and model improvements
        run: python3 kurs-v064/apply_v064.py

      - name: Apply v0.6.5 crew guns ports and islands patch
        run: |
          cat kurs-v065/patch/chunk_* > v065.patch.gz.b64
          base64 -d v065.patch.gz.b64 > v065.patch.gz
          gzip -dc v065.patch.gz > v065.patch
          sed -i 's#^--- kurs064/source-out/#--- a/#; s#^+++ kurs065/#+++ b/#' v065.patch
          cd build-project
          patch -p1 < ../v065.patch

      - name: Apply v0.6.6 road and frigate water patch
        run: |
          python3 kurs-v066/apply_v066.py
          grep -n "versionCode\|versionName" build-project/app/build.gradle
          grep -n "wakeHullHalfLength\|wakeHullHalfBeam\|drawTerrainRoad" build-project/app/src/main/java/pl/kursnahoryzont/game/WorldRenderer.java | head -n 30

      - name: Build signed release APK
        working-directory: build-project
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        working-directory: build-project
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 8 | tee apk_badging.txt
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" | tee apk_signature.txt
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 "$APK" | tail -n 4 | tee zipalign.txt
          cp "$APK" Kurs_na_Horyzont_Realme_C67_v0.6.6.apk
          sha256sum Kurs_na_Horyzont_Realme_C67_v0.6.6.apk | tee apk_sha256.txt

      - name: Create build report
        working-directory: build-project
        run: |
          CERT=$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs Kurs_na_Horyzont_Realme_C67_v0.6.6.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -n1)
          SHA=$(sha256sum Kurs_na_Horyzont_Realme_C67_v0.6.6.apk | awk '{print $1}')
          cat > Kurs_na_Horyzont_v0.6.6_BUILD_REPORT.txt <<EOF
          Kurs na Horyzont — v0.6.6 BUILD REPORT
          versionName=0.6.6
          versionCode=29
          package=pl.kursnahoryzont.game
          minSdkVersion=23
          targetSdkVersion=35
          APK=Kurs_na_Horyzont_Realme_C67_v0.6.6.apk
          APK_SHA256=$SHA

          Poprawki wysp i dróg:
          - Usunięto długie płaskie prostokąty drogi, które na pochyłym brzegu wisiały nad terenem.
          - Drogi do kei są teraz zbudowane z krótkich segmentów dopasowanych do lokalnej wysokości i nachylenia terenu.
          - Droga kończy się na lądzie przed linią wody, a dalsze dojście prowadzi po drewnianej kei.
          - Drogi łączą dojście do kei z targiem i tawerną bez przecinania zatoki zawieszonym pasem piasku.

          Poprawki wody przy statkach:
          - Kilwater korzysta teraz z rzeczywistej długości i szerokości aktualnego statku.
          - Dla fregaty kilwater zaczyna się za rzeczywistą rufą zamiast wewnątrz długiego kadłuba.
          - Fala dziobowa jest ustawiana przy rzeczywistym dziobie slupa, brygu i fregaty.
          - Dodano dłuższe grzbiety piany odrzucanej od dziobu na obie burty.
          - Fregata ma mocniejszą pianę i rozbryzg niż mniejsze jednostki.
          - Liczba segmentów piany nadal zależy od ustawionej jakości grafiki.
          - Kilwater i fala dziobowa są renderowane tylko podczas ruchu statku; przy prędkości 0 nie są wyświetlane.

          Build i podpis:
          - Gradle assembleRelease: BUILD SUCCESSFUL.
          - APK v1 signature=true.
          - APK v2 signature=true.
          - zipalign=OK.
          - Certyfikat SHA-256=$CERT
          - Test na fizycznym Realme C67 nie został wykonany w środowisku buildowym.
          EOF
          sed -i 's/^          //' Kurs_na_Horyzont_v0.6.6_BUILD_REPORT.txt

      - name: Package sources
        run: |
          rm -rf source-out
          mkdir source-out
          cp -a build-project/. source-out/
          rm -rf source-out/.gradle source-out/app/build source-out/build
          rm -f source-out/Kurs_na_Horyzont_Realme_C67_v0.6.6.apk
          zip -qr Kurs_na_Horyzont_zrodla_v0.6.6.zip source-out

      - name: Upload APK and report
        uses: actions/upload-artifact@v4
        with:
          name: Kurs_na_Horyzont_Realme_C67_v0.6.6
          path: |
            build-project/Kurs_na_Horyzont_Realme_C67_v0.6.6.apk
            build-project/Kurs_na_Horyzont_v0.6.6_BUILD_REPORT.txt
          if-no-files-found: error

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: Kurs_na_Horyzont_zrodla_v0.6.6
          path: Kurs_na_Horyzont_zrodla_v0.6.6.zip
          if-no-files-found: error
