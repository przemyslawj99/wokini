name: Build Kurs na Horyzont v0.7.0

on:
  push:
    branches:
      - chatgpt-kurs-v060-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run id
        run: |
          mkdir -p kurs-v070
          printf '%s\n' "${{ github.run_id }}" > kurs-v070/latest_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurs-v070/latest_run.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record v0.7.0 build run [skip ci]"
            git push origin HEAD:chatgpt-kurs-v060-build
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct v0.6.9 project archive
        run: |
          cat kurs-v060/v069clean/chunk_* > /tmp/project.b64
          base64 -d /tmp/project.b64 > kurs-v060/project.zip
          echo "c06d1efccdb908e2cab93e7c3e483c4562753905524d0249d469bc19310def21  kurs-v060/project.zip" | sha256sum -c -
          unzip -t kurs-v060/project.zip

      - name: Unpack project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q kurs-v060/project.zip -d build-project

      - name: Apply v0.6.10 patch
        run: |
          base64 -d kurs-v0610/v0610_patch.gz.b64 | gunzip > /tmp/v0610.patch
          cd build-project
          patch -p1 < /tmp/v0610.patch

      - name: Apply v0.7.0 crew patch
        run: |
          base64 -d kurs-v070/v070_patch.gz.b64 | gunzip > /tmp/v070.patch
          cd build-project
          patch -p1 < /tmp/v070.patch
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Build signed release APK
        working-directory: build-project
        run: gradle --no-daemon assembleRelease

      - name: Verify APK metadata and signature
        working-directory: build-project
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 5 | tee apk_badging.txt
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" | tee apk_signature.txt
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 "$APK" | tee zipalign.txt
          sha256sum "$APK" | tee apk_sha256.txt
          cp "$APK" Kurs_na_Horyzont_Realme_C67_v0.7.0.apk

      - name: Create build report
        working-directory: build-project
        run: |
          SHA=$(cut -d' ' -f1 apk_sha256.txt)
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' apk_signature.txt | sed 's/.*: //')
          cat > Kurs_na_Horyzont_v0.7.0_BUILD_REPORT.txt <<EOF
          Kurs na Horyzont — v0.7.0 BUILD REPORT
          versionName=0.7.0
          versionCode=34
          package=pl.kursnahoryzont.game
          minSdkVersion=23
          targetSdkVersion=35
          APK=Kurs_na_Horyzont_Realme_C67_v0.7.0.apk
          APK_SHA256=$SHA

          Prawdziwa załoga:
          - Każdy marynarz NPC ma aktualne zadanie zamiast stać w jednym punkcie.
          - Załoga zajmuje stanowiska przy sterze, żaglach, kotwicy, cumach i działach.
          - Marynarze przemieszczają się wizualnie pomiędzy stanowiskami na pokładzie.
          - Sternik przejmuje wachtę przy kole, kiedy kapitan nie stoi za sterem i jest wolny marynarz.
          - Rozkazy stawiania i zrzucania żagli nie wykonują się natychmiast; załoga musi dojść do stanowisk i wykonać pracę.
          - Regulacja szotów przez rozkaz za sterem ma czas wykonania zależny od klasy statku.
          - Kotwica i cumowanie dostały pracę zespołową oraz czas wykonania.
          - Obsługa dział przechodzi na pokład działowy, zajmuje stanowiska, strzela po przygotowaniu i zostaje przy działach na czas przeładowania.
          - Przeładowanie dział postępuje tylko wtedy, gdy przy danej burcie są przydzieleni artylerzyści.
          - Możliwe jest jednoczesne przydzielanie ludzi do różnych zadań, jeśli pozostają wolni marynarze.
          - HUD pokazuje wolnych ludzi, bieżący rozkaz i podział załogi między żagle, działa, pokład i ster.
          - Ręczna obsługa fału i szotów z pokładu pozostaje dostępna dla gry solo slupem.
          - Animacje rąk i chodu różnią się zależnie od wykonywanego zadania.

          Build i podpis:
          - Gradle assembleRelease: BUILD SUCCESSFUL.
          - APK v1 signature=true.
          - APK v2 signature=true.
          - zipalign=OK.
          - Certyfikat SHA-256=$CERT
          - Test na fizycznym Realme C67 nie został wykonany w środowisku buildowym.
          EOF

      - name: Package sources
        run: |
          rm -rf source-package
          mkdir source-package
          cp -a build-project/. source-package/
          rm -rf source-package/app/build source-package/.gradle source-package/build
          cd source-package
          zip -qr ../Kurs_na_Horyzont_zrodla_v0.7.0.zip .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurs_na_Horyzont_Realme_C67_v0.7.0
          path: build-project/Kurs_na_Horyzont_Realme_C67_v0.7.0.apk
          if-no-files-found: error

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Kurs_na_Horyzont_v0.7.0_BUILD_REPORT
          path: build-project/Kurs_na_Horyzont_v0.7.0_BUILD_REPORT.txt
          if-no-files-found: error

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: Kurs_na_Horyzont_zrodla_v0.7.0
          path: Kurs_na_Horyzont_zrodla_v0.7.0.zip
          if-no-files-found: error
