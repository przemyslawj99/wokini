name: Export Kurs na Horyzont v0.6.3 source

on:
  push:
    branches:
      - chatgpt-kurs-v060-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v0.6.0 base
        run: |
          cat kurs-v060/chunks/chunk_* > project.b64
          base64 -d project.b64 > project.zip
          rm -rf build-project
          mkdir build-project
          unzip -q project.zip -d build-project

      - name: Apply v0.6.3 period-ships patch
        run: |
          cat kurs-v060/v063-patch/chunk_* > v063.patch.gz.b64
          base64 -d v063.patch.gz.b64 > v063.patch.gz
          gzip -dc v063.patch.gz > v063.patch
          cd build-project
          patch -p1 < ../v063.patch

      - name: Export reconstructed source to branch
        run: |
          rm -rf kurs-v063-src
          mkdir -p kurs-v063-src/app/src/main/java/pl/kursnahoryzont/game
          mkdir -p kurs-v063-src/app/src/main/res/drawable
          cp build-project/settings.gradle kurs-v063-src/
          cp build-project/build.gradle kurs-v063-src/
          cp build-project/debug.keystore kurs-v063-src/
          cp build-project/app/build.gradle kurs-v063-src/app/
          cp build-project/app/src/main/AndroidManifest.xml kurs-v063-src/app/src/main/
          cp build-project/app/src/main/java/pl/kursnahoryzont/game/*.java kurs-v063-src/app/src/main/java/pl/kursnahoryzont/game/
          cp build-project/app/src/main/res/drawable/ic_launcher.xml kurs-v063-src/app/src/main/res/drawable/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurs-v063-src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Export reconstructed v0.6.3 source [skip ci]"
            git push origin HEAD:chatgpt-kurs-v060-build
          fi
